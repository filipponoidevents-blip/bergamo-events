# Hand-entered events. Use this for anything announced only on Instagram/Facebook.
# Venue can be a name from config/venues.yaml (coords + handles filled in automatically)
# or a full mapping. Times are Europe/Rome unless an offset is given.
#
# Example (copy, remove the leading "# " and edit):
#  - title: "Techno Friday"
#    start: 2026-11-20T23:30
#    end: 2026-11-21T05:00
#    venue: Bolgia
#    artists: [DJ One, DJ Two]
#    genres: [techno]
#    category: club
#    url: https://example.com/event

