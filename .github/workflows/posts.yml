# Renders the Instagram / TikTok posts on their cadence (Filippo, 2026-11-17):
#   weekly calendar every Monday, "Prima della serata" (pre-party + non-music) every Wednesday,
#   monthly calendar on the last Sunday of the month (for the month after).
# Nothing is posted (auto-posting is on hold): the slides are attached to the run as a
# downloadable "posts" zip (Actions tab -> the run -> Artifacts).
# Run it by hand from the Actions tab to render any post, e.g. kind=week date=2026-11-16.
name: posts
on:
  schedule: [{cron: "0 6 * * *"}]   # every day at 07:00 Rome (winter); renders only what is due
  workflow_dispatch:
    inputs:
      kind: {description: "week, midweek or month (empty = whatever is due today)", required: false, default: ""}
      date: {description: "YYYY-MM-DD for week/midweek, YYYY-MM for month", required: false, default: ""}
permissions: {contents: read}
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - name: Render
        env:
          KIND: ${{ inputs.kind }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$KIND" ]; then python -m bget carousel --$KIND "$DATE"; else python -m bget posts; fi
          ls out/carousels 2>/dev/null || echo "nothing to render today"
      - uses: actions/upload-artifact@v4
        if: hashFiles('out/carousels/*.png') != ''
        with: {name: posts, path: out/carousels/, retention-days: 30}
