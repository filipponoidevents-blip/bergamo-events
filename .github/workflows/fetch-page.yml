# Manual diagnostics: download pages from GitHub's network and keep them as a run artifact,
# so their HTML can be studied before writing a site reader.
name: fetch-page
on:
  workflow_dispatch:
    inputs:
      urls: {description: "Space-separated URLs", required: true}
permissions: {contents: read}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - env: {URLS: "${{ inputs.urls }}"}
        run: |
          mkdir pages; i=0
          for u in $URLS; do i=$((i+1)); curl -sSL -A "Mozilla/5.0 (bergamo-events-tracker)" --max-time 30 "$u" -o "pages/$i.html" || true; echo "$i $u" >> pages/index.txt; done
          ls -la pages
          python3 - <<'PY'
          import re, html
          for line in open("pages/index.txt"):
              i, u = line.split()
              t = open(f"pages/{i}.html", errors="ignore").read()
              print(f"\n===== {u} ({len(t)} bytes)")
              seen = set()
              for href, text in re.findall(r'<a[^>]+href="([^"#]+)"[^>]*>(.*?)</a>', t, re.S):
                  text = re.sub(r"<[^>]+>|\s+", " ", html.unescape(text)).strip()
                  if href in seen or not text:
                      continue
                  seen.add(href)
                  print(f"  {href[:110]} | {text[:90]}")
          PY
