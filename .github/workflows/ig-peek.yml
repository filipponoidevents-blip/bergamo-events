# Manual diagnostics: print the latest Instagram captions of a few accounts, to tune the caption reader.
# post: a post id to also OCR (every slide) and read with the monthly-programme reader.
name: ig-peek
on:
  workflow_dispatch:
    inputs:
      accounts: {description: "Space-separated Instagram usernames", required: true}
      post: {description: "Optional post id to OCR and read as a monthly programme", required: false, default: ""}
      venue: {description: "Venue of that account (for the monthly reader)", required: false, default: ""}
permissions: {contents: read}
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: ${{ inputs.post != '' }}
        run: sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ita > /dev/null
      - run: pip install -e .
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ACCOUNTS: ${{ inputs.accounts }}
          POST: ${{ inputs.post }}
          VENUE: ${{ inputs.venue }}
        run: |
          python - <<'PY'
          import os, yaml
          from datetime import datetime
          from bget.sources.instagram import GraphClient, _images
          s = yaml.safe_load(open("config/settings.yaml"))["instagram"]
          g = GraphClient(str(s["user_id"]), os.environ["IG_ACCESS_TOKEN"], s.get("graph_version", "v27.0"))
          for acc in os.environ["ACCOUNTS"].split():
              for p in g.recent_media(acc, 12):
                  print(f"=== @{acc} {p.get('id')} {p.get('timestamp')} {p.get('permalink')}\n{p.get('caption')}\n")
                  if p.get("id") != os.environ.get("POST"):
                      continue
                  from bget.config import Config
                  from bget.sources import ocr
                  from bget.sources.instagram_rules import ListingExtractor
                  imgs = _images(p)[:10]
                  text = "\n".join(t for u in imgs if (t := ocr.ocr_url(u)))
                  print(f"--- OCR of {len(imgs)} slides ---\n{text}\n--- read ---")
                  cfg = Config.load() if hasattr(Config, "load") else Config.from_root()
                  posted = datetime.fromisoformat(p["timestamp"].replace("+0000", "+00:00"))
                  ex = ListingExtractor(cfg)(caption=f"{p.get('caption') or ''}\n\n{text}", image_urls=[],
                                             posted_at=posted, account=acc, account_venue=os.environ.get("VENUE") or None)
                  print(ex.is_event_announcement, ex.notes)
                  for e in ex.events:
                      print(" ", e.date, e.start_time, e.title)
          PY
