# Runs the collector every 6 hours.
# - Commits the updated event store (data/events.json) to main.
# - Publishes the contents of out/ (the .ics feeds and alerts.md) to the `feed` branch.
#   Cloudflare Pages is connected to the `feed` branch with no build command, so it
#   serves e.g. https://<project>.pages.dev/bergamo.ics while this repo stays private.
name: update-calendar
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["config/**", "data/manual_events.yaml", "src/**"]
permissions:
  contents: write
concurrency: {group: update-calendar, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install OCR (free flyer reading)
        run: sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ita > /dev/null
      - run: pip install -e .
      - run: python -m bget run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated event store
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add data/events.json data/ig_review.json 2>/dev/null || git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "Update events [skip ci]"
            # another run may have updated the data meanwhile: keep this run's fresher copy
            git pull --rebase -X theirs -q origin main
            git push
          fi
      - name: Publish feeds to the feed branch
        run: |
          mkdir -p /tmp/feed && cp out/*.ics out/alerts.md /tmp/feed/ && cp out/review.md /tmp/feed/ 2>/dev/null || true
          cd /tmp/feed
          git init -q -b feed
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Feed update $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed
