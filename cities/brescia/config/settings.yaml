# Labels used on calendars and posts. Feeds are published next to Bergamo's on the calendar site:
#   brescia.ics, brescia_alerts.ics, brescia_all.ics, brescia_other.ics
city:
  brand: Brescia Nights
  area: BRESCIA E DINTORNI
  handle: "@seratebrescia"   # TO CONFIRM (Filippo): account shown on the Brescia posts
  hashtags: ["#brescia", "#brescianightlife", "#techno", "#housemusic", "#techhouse", "#clubbing"]

# Same Instagram token as Bergamo: the renewal reminders already go in Bergamo's alerts calendar.
instagram:
  token_renewed: null
