# Brescia: only what differs from the main config/settings.yaml (everything else is inherited:
# genre weights, thresholds, serata/preserata times, Instagram reader and token settings).
home:
  name: Brescia
  lat: 45.5416
  lon: 10.2118
  radius_km: 20

# Outside the radius, events are only kept as ALERTS, from these provinces (plus national brands).
