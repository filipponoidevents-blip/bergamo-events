# Ranking: the order of nights in the posts (higher first). Filippo edits this file.
# Each night gets five scores 0-10 and a weighted average of them (src/bget/ranking.py):
#   location  the venue's importance          -> venues: "Name": score   (or {score, capacity, rooms})
#   room      main room 10, second rooms lower -> rooms (below), or per venue under rooms:
#   capacity  people the venue/room holds      -> capacity: 800 (100 -> 2, 400 -> 6, 1600+ -> 10),
#             or by season: {summer: 3000, winter: 100} (summer = May-September)
#   party     the party / promoter's relevance -> promoters: "Name": score (empty = from its Instagram followers)
#   guest     special guests: watchlist name 10, else tagged artists by IG followers (locals 0), "special guest" line 3
# Bars (kind: bar in venues.yaml) are not scored: nearest to the centre first, A-Z at similar distance.
# A score left empty counts 0. First pass 2026-11-17 by Claude from the type of venue: to be corrected.
# Example with rooms and capacity:
#   "Zero Club": {score: 6, capacity: 800, rooms: {main room: {score: 10, capacity: 600}, club room: {score: 6, capacity: 200}}}

weights: {location: 1.0, room: 0.5, capacity: 1.0, party: 1.5, guest: 2.0}

