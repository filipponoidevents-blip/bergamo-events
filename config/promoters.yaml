# Promoters, crews and festival brands active in the Bergamo +20 km area (researched 2026-11-16).
# Not read by the pipeline yet: use it to fill `instagram_watch.accounts` in sources.yaml and
# to recognise organiser names in event titles. Same ig_source / ig_type meaning as venues.yaml.

promoters:
  - name: Hidden Hell
    instagram: hiddenhell.techno
    ig_source: user
    genres: [hard techno]
    venues: [Bolgia, Zero Club]
    notes: Hidden Hell x Code at Zero Club (13 Nov 2026). Runs Bolgia Main Room nights (e.g. USH opening, 5 Sep 2026).
  - name: Galactica Festival
    instagram: galactica.festival
    ig_source: search
    genres: [techno]
    venues: [Bolgia]
    relevance: low
    notes: "One-off big-event brand that collaborated with Bolgia; not a regular local promoter (per Filippo)."
  - name: JUICE Crew
    aliases: [JUICE, JUICE (BG)]
    instagram: juiceclubit
    ig_source: user
    ig_type: business (Call button)
    website: https://www.juiceclub.it
    genres: [house, tech house]
    venues: [Nikita, Setai Club, LOFT Bergamo]
    notes: Deep house (Dani Vescovi, Lapo Underground, Nesta). Runs "El Jardín de Nikita". Partners LOFT Bergamo, LOOP, Metaphora, Beatmode.
  - name: Groove Factory
    instagram: null
    ig_source: null
    genres: [tech house]
    venues: [Bolgia]
    notes: "Bolgia's own tech house night brand (per Filippo). No own Instagram: posted by @bolgia.official. Ilario Alicante 14 Nov 2026; Summer Garden opening."
  - name: Supertato
    instagram: supertatobolgia
    ig_source: search
    venues: [Bolgia]
    notes: Party brand at Bolgia.
  - name: LTC (Lorenzo Tiezzi Comunicazione)
