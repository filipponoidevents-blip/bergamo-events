# Where events come from. Each entry is handled by the adapter named in `type`.
#
# Adapter types implemented in the skeleton:
#   manual   - hand-entered events in a YAML file (always works; good for IG-only announcements)
#   jsonld   - any web page that embeds schema.org Event / MusicEvent JSON-LD.
#              Dice, Xceed, Shotgun, Eventbrite, Ticketone and most WordPress venue sites do this.
#   ical     - any public .ics feed (some venues/promoters publish one; Google Calendar public links)
#
# Adapters planned (stubs in src/bget/sources/, see ARCHITECTURE.md):
#   resident_advisor - RA listings for the Lombardy area (RA has no public API; uses the
#                      site's GraphQL endpoint, so check their terms and keep request volume low)
#   instagram        - (built) Instagram Graph API "Business Discovery": reads recent public posts of
#                      Business/Creator accounts (venues, promoters). Needs our own IG Business
#                      account + Facebook app token. Posts are text, so they go to a review queue.
#   facebook_events  - No public API for third-party events since 2018; manual/forwarded only.

sources:
  - id: manual
    type: manual
    enabled: true
    path: data/manual_events.yaml

  - id: sample_jsonld
    type: jsonld
    enabled: true
    note: Offline fixture proving the JSON-LD adapter works end to end.
    urls:
      - file://tests/fixtures/sample_event_page.html

  # Fill these in with real listing/event pages once verified:
  - id: dice_milano
    type: jsonld
    enabled: false
    urls: []      # e.g. individual dice.fm event pages for BG/MI venues

  - id: xceed_bergamo
    type: jsonld
    enabled: false
    urls: []

  # Ticketing sites Filippo uses (probed from GitHub's network on 2026-11-16):
  #   Fourvenues - blocks automated requests (403) -> needs another route
  #   Xceed      - city listing URL still to find; event pages to be checked
  #   Upass      - homepage has no structured data; /club/ pages to be checked
  #   TicketSMS  - JavaScript app, homepage has no events in the HTML
  # Paste example event links into `urls` and run the probe-site workflow to check them.
  - id: fourvenues
    type: jsonld
    enabled: false
    urls: []
  - id: upass
    type: jsonld
    enabled: false
    urls: []
  - id: ticketsms
    type: jsonld
    enabled: false
    urls: []

  - id: venue_websites
    type: jsonld
    enabled: false
    urls: []      # club "events" pages that embed JSON-LD

  - id: venue_icals
    type: ical
    enabled: false
    urls: []

  - id: resident_advisor
    type: resident_advisor
    enabled: false
    area: milan   # RA groups Bergamo under the Milan/Lombardy area

  # Instagram auto-check. Needs secrets IG_USER_ID, IG_ACCESS_TOKEN, ANTHROPIC_API_KEY.
  # Only public Business/Creator accounts can be read. For a venue account, set `venue`
  # to its name in venues.yaml so posts without a venue default to it.
  - id: instagram_watch
    type: instagram
    enabled: true
    # Tracker account: @seratebergamo (Filippo's new Business account, 2026-11-16).
    # Watch list: every venue/promoter with a confirmed handle whose account is not personal.
    # Personal accounts (UFO, Garota, Delblaco, OperaPrima) are left out: the API cannot read them.
    # @nightlifebergamo is deliberately NOT here: it is for venue discovery only, not a calendar.
    # Format: venue accounts {username: x, venue: <name in venues.yaml>}; promoters plain handle.
    # Aggregators that post the week's agenda as an image: {username: x, listing: true}
    # Any account whose details are only on the flyer: add ocr: true
