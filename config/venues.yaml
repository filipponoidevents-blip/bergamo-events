# Venue registry. Collectors match scraped venue names against `name` and `aliases`
# to attach coordinates, province and social handles.
#
# Researched 2026-11-16 (Bergamo +20 km). How to read the extra fields:
#   ig_source   website = the venue's own site links this account (strongest)
#               search  = profile found by name on Instagram via web search, name + town match
#               user    = given or confirmed by Filippo
#               null    = no account confirmed; handle left blank on purpose
#   ig_type     Instagram blocks automated profile reads, so Business/Creator status could not be
#               checked. Brand accounts are almost always professional; confirm before relying on it.
#   status      active | check (no recent sign of activity found) | closed
#   km          straight-line distance from Bergamo centre (45.6983, 9.6773)
#   tickets     ticket/listing pages that the jsonld adapter could read
# `verified: true` only where address and handle come from the venue's own pages.
# Coordinates are approximate (street or town level). Extra keys are ignored by the loader.

venues:
