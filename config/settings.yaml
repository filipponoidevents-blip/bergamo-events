# Where "local" is measured from and how far it reaches.
home:
  name: Bergamo
  lat: 45.6983
  lon: 9.6773
  radius_km: 20
timezone: Europe/Rome

# Outside the radius, events are only kept as ALERTS, and only from these provinces
# (plus anything flagged national, wherever it is in Italy).
alert_provinces: [MI, MB, BS, LC, CO, CR, VA, LO, SO]

# Genre weights. Matched (case-insensitive) against genres, title, description and artist genres.
genres:
  techno: 3.0
  tech house: 3.0
  tech-house: 3.0
  house: 2.5
  deep house: 2.5
  afro house: 2.0
  melodic techno: 2.5
  minimal: 2.0
  hard techno: 2.0
  electronic: 1.5
  elettronica: 1.5
  dj set: 1.5
  disco: 1.2
  edm: 1.0
  drum and bass: 1.0
  "drum & bass": 1.0
  trance: 1.0
  hip hop: 0.6
  reggaeton: 0.4
  commerciale: 0.3

# Venue kinds that count as nightlife on their own.
venue_kind_bonus:
  club: 1.5
  open_air: 1.0
  live_club: 0.3

# Serata or preserata is decided by the VENUE only, never by the start time (Filippo, 2026-11-17).
# Venues of these kinds are preserata (aperitivo, lounge, cocktail bar): their events leave the
# weekly/monthly posts and go in the midweek "Prima della serata" post. Every other kind is serata.
# One venue can differ with `preserata: true` or `preserata: false` in venues.yaml.
preserata_kinds: [bar]

thresholds:
  local_min_score: 2.0      # in-radius event needs this much to make the calendar
  alert_min_score: 6.0      # out-of-radius event needs this much (or a watchlist hit)
  concert_requires_watchlist: true   # live concerts only if headliner is on the crossover list

# Instagram auto-check (source type "instagram" in sources.yaml)
instagram:
  token_renewed: 2026-11-16   # date the IG_ACCESS_TOKEN secret was last set; renewal reminders go in alerts.ics
  user_id: "17841456676305081"  # @seratebergamo, the account making the API calls (not secret)
  graph_version: v27.0        # Meta Graph API version (matches the Graph API Explorer, Nov 2026)
  posts_per_account: 12       # latest posts read per account per run
  accounts_per_run: 20        # Meta's hourly limit for development-mode apps; the rest are checked next run
  max_post_age_days: 21       # older posts are skipped
  ocr: false                  # free: read text in flyer images with Tesseract for every account (slower)
  read_images: false          # reader: claude only. true = also read flyer images (more accurate, costs more)
  auto_approve_confidence: 0.7   # Filippo approved every club night so far (2026-11-16)
  # Categories: dj_club, live_music, comedy, quiz_games, food_drink, culture, other
  calendar_categories: [dj_club]   # only these go on the calendar; the rest are kept in other_events.md / other.ics   # at or above: straight to the calendar; below: waits for approval
  reader: rules               # rules = free pattern matcher (no key); claude = AI reader, needs ANTHROPIC_API_KEY
  model: claude-haiku-5-5     # used only when reader: claude (a few cents a month)
  effort: low
